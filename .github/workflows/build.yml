name: NexOS build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install QEMU
        run: sudo apt-get update && sudo apt-get install -y qemu-system-x86

      - name: Build NexOS
        run: cargo build --release

      - name: Build kernel directly
        run: cargo build --release --package nexkernel --target x86_64-unknown-none
