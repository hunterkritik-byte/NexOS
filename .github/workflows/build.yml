name: NexOS CI

on:
  push:
    branches: ["main"]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write

concurrency:
  group: nexos-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  kernel:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust nightly
        uses: dtolnay/rust-toolchain@nightly
        with:
          targets: x86_64-unknown-none
          components: rustfmt, llvm-tools-preview, rust-src

      - name: Format
        run: cargo fmt --all

      - name: Check workspace
        run: cargo check --workspace

      - name: Test persistent filesystem on host
        run: cargo test -p nexkernel --test persistent_fs

      - name: Build kernel
        run: cargo build --release --package nexkernel --target x86_64-unknown-none

      - name: Upload kernel
        uses: actions/upload-artifact@v4
        with:
          name: NexOS-x86_64-kernel
          path: target/x86_64-unknown-none/release/nexkernel

  boot-image:
    needs: kernel
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust nightly
        uses: dtolnay/rust-toolchain@nightly
        with:
          targets: x86_64-unknown-none
          components: rustfmt, llvm-tools-preview, rust-src

      - name: Install QEMU and ISO tools
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-x86 ovmf xorriso
          echo "Installed OVMF files:"
          find /usr/share/OVMF /usr/share/edk2 -maxdepth 2 -type f 2>/dev/null | sort || true
          OVMF_CODE="$(find /usr/share/OVMF /usr/share/edk2 -type f \( -name 'OVMF_CODE_4M.fd' -o -name 'OVMF_CODE.fd' -o -name 'OVMF_CODE.ms.fd' \) 2>/dev/null | head -n1)"
          if [ -z "$OVMF_CODE" ]; then
            echo "ERROR: OVMF firmware not found"
            exit 1
          fi
          echo "Using OVMF firmware: $OVMF_CODE"
          echo "OVMF_CODE=$OVMF_CODE" >> "$GITHUB_ENV"

      - name: Build NexShell userspace ELF
        run: |
          cargo build --release --package nexshell --target x86_64-unknown-none
          test -s target/x86_64-unknown-none/release/nexshell

      - name: Build kernel
        run: |
          cargo build \
            --release \
            --package nexkernel \
            --target x86_64-unknown-none

      - name: Build NexOS boot images
        run: |
          mkdir -p dist
          timeout --signal=TERM --kill-after=30s 5m cargo run \
            --release \
            --package nexos-image-builder \
            -- \
            target/x86_64-unknown-none/release/nexkernel \
            target/x86_64-unknown-none/release/nexshell \
            dist/NexOS-x86_64-bios.img \
            dist/NexOS-x86_64-uefi.img

      - name: Validate BIOS image
        run: |
          timeout 10s qemu-system-x86_64 -L /usr/share/OVMF \
            -drive format=raw,file=dist/NexOS-x86_64-bios.img \
            -serial stdio \
            -display none \
            -no-reboot \
            -no-shutdown \
            || test $? -eq 124

      - name: Validate UEFI image
        run: |
          OVMF_VARS="$(find /usr/share/OVMF /usr/share/edk2 -type f \( -name 'OVMF_VARS_4M.fd' -o -name 'OVMF_VARS.fd' -o -name 'OVMF_VARS_4M.ms.fd' \) 2>/dev/null | head -n1)"
          test -n "$OVMF_VARS"
          cp "$OVMF_VARS" "$RUNNER_TEMP/OVMF_VARS.fd"
          timeout 10s qemu-system-x86_64 \
            -drive if=pflash,format=raw,readonly=on,file="$OVMF_CODE" \
            -drive if=pflash,format=raw,file="$RUNNER_TEMP/OVMF_VARS.fd" \
            -drive format=raw,file=dist/NexOS-x86_64-uefi.img \
            -serial stdio \
            -display none \
            -no-reboot \
            -no-shutdown \
            || test $? -eq 124


      - name: Generate ISO
        run: |
          mkdir -p iso-root/EFI/BOOT
          mkdir -p iso-root/boot

          cp dist/NexOS-x86_64-uefi.img iso-root/boot/NexOS-UEFI.img
          cp dist/NexOS-x86_64-bios.img iso-root/boot/NexOS-BIOS.img

          xorriso \
            -as mkisofs \
            -iso-level 3 \
            -volid "NEXOS" \
            -o dist/NexOS-x86_64.iso \
            iso-root

      - name: Generate checksums
        run: |
          cd dist
          sha256sum * > SHA256SUMS

      - name: Upload NexOS images
        uses: actions/upload-artifact@v4
        with:
          name: NexOS-x86_64-images
          path: |
            dist/NexOS-x86_64.iso
            dist/NexOS-x86_64-bios.img
            dist/NexOS-x86_64-uefi.img
            dist/SHA256SUMS

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}"             dist/NexOS-x86_64.iso             dist/NexOS-x86_64-bios.img             dist/NexOS-x86_64-uefi.img             dist/SHA256SUMS             --title "NexOS ${GITHUB_REF_NAME}"             --generate-notes


  desktop-iso:
    name: Build NexOS Desktop ISO
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4

      - name: Install live-build and ISO dependencies
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            live-build debootstrap xorriso squashfs-tools \
            grub-pc-bin grub-efi-amd64-bin ovmf \
            dosfstools mtools ca-certificates

      - name: Build full NexOS Desktop ISO
        run: |
          chmod +x scripts/build-linux.sh
          sudo ./scripts/build-linux.sh

      - name: Validate Desktop ISO
        run: |
          test -s dist/NexOS-Linux-x64.iso
          size=$(stat -c %s dist/NexOS-Linux-x64.iso)
          echo "Desktop ISO size: $size bytes"
          test "$size" -gt 50000000
          sha256sum -c dist/NexOS-Linux-x64.iso.sha256
          sha512sum dist/NexOS-Linux-x64.iso > dist/NexOS-Linux-x64.iso.sha512
          file dist/NexOS-Linux-x64.iso

      - name: Upload NexOS Desktop ISO
        uses: actions/upload-artifact@v4
        with:
          name: NexOS-Desktop-x64
          path: |
            dist/NexOS-Linux-x64.iso
            dist/NexOS-Linux-x64.iso.sha256
            dist/NexOS-Linux-x64.iso.sha512
          retention-days: 30
