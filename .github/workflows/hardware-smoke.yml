name: NexOS Hardware Smoke Tests

on:
  workflow_dispatch:
  push:
    paths:
      - 'distro/config/**'
      - '.github/workflows/hardware-smoke.yml'
      - 'docs/HARDWARE-TESTING.md'

jobs:
  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install hardware test tools
        run: |
          sudo apt-get update
          sudo apt-get install -y             bluez             bluez-tools             pipewire             wireplumber             alsa-utils             usbutils             pciutils             udev             util-linux             network-manager

      - name: Kernel and architecture
        run: |
          set -eux
          uname -a
          test "$(uname -m)" = "x86_64"

      - name: USB and PCI enumeration
        run: |
          set -eux
          lsusb || true
          lspci || true
          udevadm info --export-db >/tmp/udev-db
          test -s /tmp/udev-db

      - name: Bluetooth software smoke test
        run: |
          set -eux
          bluetoothctl --version
          bluetoothd --version
          timeout 10s bluetoothctl list || true
          timeout 10s bluetoothctl show || true

      - name: Audio software smoke test
        run: |
          set -eux
          pipewire --version
          wireplumber --version
          wpctl status || true
          aplay --version
          arecord --version
          timeout 10s pw-cli info 0 || true

      - name: NetworkManager smoke test
        run: |
          set -eux
          nmcli --version
          timeout 10s nmcli general status || true
          timeout 10s nmcli device status || true

      - name: NexOS hardware checker
        run: |
          set -eux
          test -f distro/config/hooks/live/0300-hardware-services.hook.chroot
          sh -n distro/config/hooks/live/0300-hardware-services.hook.chroot
          grep -q 'hardware-check.sh' distro/config/hooks/live/0300-hardware-services.hook.chroot

      - name: Report hardware limitation
        run: |
          echo "CI smoke tests validate NexOS/Linux tooling and enumeration."
          echo "They do NOT prove physical Bluetooth, audio, USB, Wi-Fi, or microphone compatibility."
