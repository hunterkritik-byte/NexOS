[package]
name = "nexkernel"
version = "0.1.0"
edition = "2024"
authors = ["Kritik Bhattarai"]
license = "Apache-2.0"
description = "NexKernel, the NexOS kernel."

[[bin]]
name = "nexkernel"
path = "src/main.rs"

[dependencies]
bootloader_api = { version = "0.11.17", features = ["x86_64"] }
uart_16550 = { version = "0.6.0", features = ["x86_64"] }
x86_64 = { version = "0.15.2", default-features = false }
