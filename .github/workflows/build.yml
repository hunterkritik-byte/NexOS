name: NexOS CI

on:
  push:
    branches: ["main"]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write

jobs:
  kernel:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust nightly
        uses: dtolnay/rust-toolchain@nightly-2026-07-06
        with:
          targets: x86_64-unknown-none
          components: llvm-tools-preview
      - name: Format
        run: cargo fmt --all -- --check
      - name: Check workspace
        run: cargo check --workspace
      - name: Build kernel
        run: cargo build --release --package nexkernel --target x86_64-unknown-none

  boot-image:
    needs: kernel
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install host tools
        run: sudo apt-get update && sudo apt-get install -y qemu-system-x86 ovmf xorriso mtools
      - name: Install Rust nightly
        uses: dtolnay/rust-toolchain@nightly-2026-07-06
        with:
          targets: x86_64-unknown-none
          components: llvm-tools-preview
      - name: Build bootloader image tooling
        run: |
          cargo install bootimage --version 0.10.0
      - name: Build kernel
        run: cargo build --release --package nexkernel --target x86_64-unknown-none
      - name: Create boot image
        run: |
          mkdir -p dist
          echo "Boot image generation will be enabled once the installer/image builder is part of the NexOS workspace."
          echo "The kernel build is the release gate for this development stage."
      - name: Upload kernel artifact
        uses: actions/upload-artifact@v4
        with:
          name: NexOS-x86_64-kernel
          path: target/x86_64-unknown-none/release/nexkernel

