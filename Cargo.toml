[workspace]
resolver = "3"
members = ["kernel"]

[package]
name = "nexos"
version = "0.1.0"
edition = "2024"
authors = ["Kritik Bhattarai"]
license = "Apache-2.0"
description = "NexOS operating system build and image tooling."

[dependencies]
ovmf-prebuilt = "0.2.4"

[build-dependencies]
nexkernel = { path = "kernel", artifact = "bin", target = "x86_64-unknown-none" }
bootloader = "0.11.17"
